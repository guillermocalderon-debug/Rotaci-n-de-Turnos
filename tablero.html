<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Producción - Libus</title>
    <style>
        /* DISEÑO OPTIMIZADO PARA TV (Escalado Automático) */
        :root {
            --primary: #e6005a;
            --bg: #f0f2f5;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 2vh 3vw; 
            height: 100vh;    
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            color: #333;
        }
        
        /* Encabezado */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5vh solid var(--primary);
            padding-bottom: 1vh;
            margin-bottom: 2vh;
            height: 12vh; 
        }
        
        .logo { 
            height: 8vh; 
            max-width: 20vw;
            object-fit: contain;
        }
        
        .header-title { font-size: 4.5vh; font-weight: 900; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
        .clock-container { text-align: right; }
        .time { font-size: 5.5vh; font-weight: bold; line-height: 1; color: #111; }
        .date { font-size: 2vh; color: #666; font-weight: bold; text-transform: uppercase; }

        /* Contenedor de las 3 Columnas */
        .board {
            display: flex;
            gap: 2vw;
            height: 80vh; 
        }
        
        .col {
            flex: 1;
            background: white;
            border-radius: 1.5vh;
            box-shadow: 0 1vh 2vh rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .col h2 {
            text-align: center;
            margin: 0;
            padding: 1.5vh;
            font-size: 3.5vh;
            text-transform: uppercase;
            letter-spacing: 2px;
            height: 8vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .col.manana h2 { background-color: #ffc107; color: #000; }
        .col.tarde h2 { background-color: #17a2b8; color: #fff; }
        .col.noche h2 { background-color: #343a40; color: #fff; }
        
        /* Lista de Operarios */
        .worker-list {
            padding: 1.5vh;
            display: flex;
            flex-direction: column;
            gap: 1.2vh;
            height: calc(100% - 8vh); 
            box-sizing: border-box;
        }

        /* Tarjetas de Operarios Flexibles */
        .worker-card {
            background: #f8f9fa;
            border-left: 0.8vh solid var(--primary);
            padding: 0 2vw;
            border-radius: 0 1vh 1vh 0;
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 0;
        }
        
        .w-name { font-size: 3vh; font-weight: bold; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .w-machine { font-size: 2.2vh; color: var(--primary); font-weight: bold; margin-top: 0.5vh; }
        
        #loadingMsg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 4vh; font-weight: bold; color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <!-- Etiqueta de imagen corregida para igualar la que funciona en la consulta de turnos -->
        <img src="libus_positivo_CMYK.jpg" alt="Logo Libus" class="logo" onerror="this.src='https://latam.libus.com/imagenes/logo_libus.png'">
        
        <h1 class="header-title">Asignación de Máquinas</h1>
        <div class="clock-container">
            <div class="time" id="clock">00:00</div>
            <div class="date" id="dateDisplay">Cargando...</div>
        </div>
    </header>

    <div id="loadingMsg">Sincronizando con Producción... ⏳</div>

    <div class="board" id="mainBoard" style="display: none;">
        <!-- Turno Mañana -->
        <div class="col manana">
            <h2>☀️ Mañana</h2>
            <div class="worker-list" id="listManana"></div>
        </div>
        
        <!-- Turno Tarde -->
        <div class="col tarde">
            <h2>🌤️ Tarde</h2>
            <div class="worker-list" id="listTarde"></div>
        </div>
        
        <!-- Turno Noche -->
        <div class="col noche">
            <h2>🌙 Noche</h2>
            <div class="worker-list" id="listNoche"></div>
        </div>
    </div>

<script>
    // URL DE APPS SCRIPT
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzxBhGp2oElpCW6YzacSbDhqGvbih0X0dBZmnipIkscPp2uJx2CqRQstESXu7M0iZ1gLA/exec'; 

    // Reloj
    function actualizarReloj() {
        const ahora = new Date();
        const horas = String(ahora.getHours()).padStart(2, '0');
        const minutos = String(ahora.getMinutes()).padStart(2, '0');
        document.getElementById('clock').innerText = `${horas}:${minutos}`;
        
        const opcionesFecha = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('dateDisplay').innerText = ahora.toLocaleDateString('es-ES', opcionesFecha);
    }
    setInterval(actualizarReloj, 1000);
    actualizarReloj();

    function normalizarFecha(str) {
        if (!str) return "";
        let s = String(str).trim();
        if (s.includes("/")) {
            let partes = s.split("/");
            if(partes.length === 3) {
                let d = String(partes[0]).padStart(2, '0');
                let m = String(partes[1]).padStart(2, '0');
                return `${d}/${m}/${partes[2]}`;
            }
        }
        return s;
    }

    function getHoyStr() {
        const hoy = new Date();
        const d = String(hoy.getDate()).padStart(2, '0');
        const m = String(hoy.getMonth() + 1).padStart(2, '0');
        return `${d}/${m}/${hoy.getFullYear()}`;
    }

    function analizarCelda(valor) {
        if (!valor || valor === "") return { turno: "LIBRE", maquina: "" };
        const v = valor.toUpperCase();
        if (v.includes("LIBRE")) return { turno: "LIBRE", maquina: "" };

        let turnoStr = "DESCONOCIDO";
        if (v.includes("(M)")) turnoStr = "MAÑANA";
        else if (v.includes("(T)")) turnoStr = "TARDE";
        else if (v.includes("(N)")) turnoStr = "NOCHE";

        let maquinaStr = valor.replace(/\s*\([MTNmtn]\)\s*/g, '').trim();
        if (maquinaStr === "") maquinaStr = "Mantenimiento";

        return { turno: turnoStr, maquina: maquinaStr };
    }

    function descargarDatosJSONP() {
        const callbackName = 'jsonpCallback_' + Math.round(100000 * Math.random());
        
        window[callbackName] = function(filasArray) {
            try {
                if (!filasArray || filasArray.length === 0) throw new Error("Planilla vacía");

                let headerIndex = 0;
                for (let i = 0; i < Math.min(5, filasArray.length); i++) {
                    if (filasArray[i] && String(filasArray[i][1]).trim().toLowerCase() === "operario") {
                        headerIndex = i;
                        break;
                    }
                }

                let rawFechas = filasArray[headerIndex].slice(2).filter(f => f && String(f).trim() !== ""); 
                let fechas = rawFechas.map(normalizarFecha);
                
                let hoyStr = getHoyStr();
                let indexHoy = fechas.indexOf(hoyStr);
                if (indexHoy === -1) indexHoy = 0; 

                let htmlManana = '';
                let htmlTarde = '';
                let htmlNoche = '';

                for (let i = headerIndex + 1; i < filasArray.length; i++) {
                    let filaActual = filasArray[i];
                    if (filaActual.length < 2) continue;
                    
                    let nombreOperario = String(filaActual[1]).trim();
                    if (nombreOperario === "") continue;

                    let valorCelda = filaActual[indexHoy + 2] !== undefined ? String(filaActual[indexHoy + 2]).trim() : "";
                    let datos = analizarCelda(valorCelda);

                    let cardHTML = `
                        <div class="worker-card">
                            <span class="w-name">${nombreOperario}</span>
                            <span class="w-machine">⚙️ ${datos.maquina}</span>
                        </div>
                    `;

                    if (datos.turno === "MAÑANA") htmlManana += cardHTML;
                    else if (datos.turno === "TARDE") htmlTarde += cardHTML;
                    else if (datos.turno === "NOCHE") htmlNoche += cardHTML;
                }

                document.getElementById('listManana').innerHTML = htmlManana || '<p style="text-align:center; color:#999; font-size:3vh; margin-top:20px;">Sin asignaciones</p>';
                document.getElementById('listTarde').innerHTML = htmlTarde || '<p style="text-align:center; color:#999; font-size:3vh; margin-top:20px;">Sin asignaciones</p>';
                document.getElementById('listNoche').innerHTML = htmlNoche || '<p style="text-align:center; color:#999; font-size:3vh; margin-top:20px;">Sin asignaciones</p>';

                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('mainBoard').style.display = 'flex';

            } catch (error) {
                console.error(error);
                document.getElementById("loadingMsg").innerText = "❌ Error sincronizando datos.";
            } finally {
                delete window[callbackName];
                const scriptEl = document.getElementById(callbackName);
                if(scriptEl) scriptEl.remove();
            }
        };

        const script = document.createElement('script');
        script.id = callbackName;
        script.src = APPS_SCRIPT_URL + "?callback=" + callbackName;
        document.body.appendChild(script);
    }

    // Iniciar carga
    window.onload = descargarDatosJSONP;

    // Recargar la web completa cada 10 minutos para mantener datos al día en Yodeck
    setInterval(() => {
        window.location.reload();
    }, 600000);

</script>
</body>
</html>
