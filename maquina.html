<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Producción - Libus</title>
    <style>
        :root {
            --primary: #e6005a;
            --bg: #f4f7f6;
            --text: #333;
            --card-bg: #ffffff;
            --success: #198754;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 2vh 2vw; box-sizing: border-box;}
        
        /* Contenedor principal que se vuelve elástico en Modo TV */
        #mainBody { display: flex; flex-direction: column; height: 100%; }

        /* ========================================================
           CABECERA OPTIMIZADA (Línea Horizontal)
           ======================================================== */
        .top-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 2vh; 
            padding-bottom: 1vh;
            border-bottom: 2px solid var(--border-color, #e2e8f0);
        }
        .header-left { flex: 1; display: flex; justify-content: flex-start; align-items: center; }
        .header-center { flex: 2; text-align: center; }
        .header-right { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 5px;}

        .logo { height: min(45px, 6vh); }
        .dashboard-title { font-size: min(32px, 3.8vh); font-weight: 900; color: #111; margin: 0; text-transform: uppercase; letter-spacing: 1px;}
        .footer-update { font-size: min(13px, 1.8vh); color: #777; font-weight: bold; margin-top: 0.5vh;}
        .info-note { background-color: #e8f5e9; border-left: 5px solid var(--success); color: #146c43; padding: 0.8vh 1vw; border-radius: 6px; font-size: min(14px, 1.8vh); margin: 0; font-weight: 600;}
        
        #loadingMsg { text-align: center; color: var(--primary); font-weight: bold; font-size: 18px; margin: 2vh 0; }
        #errorMsg { text-align: center; color: #d9534f; font-weight: bold; display: none; margin: 2vh auto; background: #ffebee; padding: 15px; border-radius: 8px; max-width: 400px; }

        /* Sistema de cuadrícula por defecto (Celular/PC) */
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 1.5vw; 
            width: 100%; 
            max-width: 1800px; 
            margin: 0 auto; 
            flex-grow: 1; 
        }
        
        .single-mode .grid-container { max-width: 450px; }

        /* Tarjeta principal por máquina */
        .machine-wrapper { background: var(--card-bg); padding: 1vw; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 5px solid var(--primary); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;}
        .machine-header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 0.8vh; margin-bottom: 1vh; }
        .m-title { font-size: min(24px, 2.8vh); font-weight: 900; margin: 0; color: #222; }

        /* 🔥 ALERTA DINÁMICA DE MÁQUINA DETENIDA 🔥 */
        .detenida-alert { 
            background-color: #ffc107; color: #000; text-align: center; padding: 1.5vh; 
            font-size: min(18px, 2.5vh); font-weight: 900; border-radius: 8px; 
            border: 3px solid #e0a800; text-transform: uppercase; 
            width: 100%; box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.4);
            animation: dangerPulse 1.5s infinite alternate;
        }
        @keyframes dangerPulse {
            from { background-color: #ffc107; box-shadow: 0 0 10px rgba(255, 193, 7, 0.4); transform: scale(1); color: #000; border-color: #e0a800;}
            to { background-color: #ff2a2a; box-shadow: 0 0 25px rgba(255, 42, 42, 0.8); transform: scale(1.05); color: #fff; border-color: #cc0000;}
        }

        /* Contenedor central para cuando la máquina está detenida */
        .center-content { flex-grow: 1; display: flex; align-items: center; justify-content: center; }

        /* Niveles */
        .nivel-card.normal { background: #fdfdfd; border: 1px solid #e0e0e0; border-left: 5px solid #888; border-radius: 8px; padding: 0.8vh 1vw; margin-bottom: 1vh; }
        .nivel-card.normal .nivel-title { font-size: min(13px, 1.8vh); color: #666; font-weight: 900; margin: 0 0 0.5vh 0; }
        
        .nivel-card.active { border: 2px solid var(--success); background: #f8fff9; border-radius: 8px; margin-bottom: 1vh; overflow: hidden; }
        .nivel-card.active .nivel-header { background-color: var(--success); padding: 0.6vh 1vw; display: flex; justify-content: space-between; align-items: center; }
        .nivel-card.active .nivel-title { color: white; font-size: min(14px, 2vh); font-weight: 900; margin: 0; }
        .badge-produccion { background: white; color: var(--success); font-size: min(10px, 1.4vh); padding: 0.2vh 0.8vw; border-radius: 20px; font-weight: 900; }
        .nivel-card.active .nivel-body { padding: 1vh 1vw; }

        .data-row { display: flex; margin-bottom: 0.3vh; font-size: min(14px, 1.9vh); }
        .data-label { font-weight: bold; width: min(60px, 5vw); color: #555; }
        .data-value { flex: 1; color: #222; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .data-value.ref { font-weight: 400; color: #444; font-size: min(13px, 1.8vh); }
        
        .empty-state { text-align: center; color: #888; font-style: italic; padding: 1vh; font-size: min(14px, 1.8vh);}
        .sync-indicator { display: inline-block; width: 8px; height: 8px; background: #e6005a; border-radius: 50%; animation: pulse 1s infinite; margin-left: 5px; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.2); } 100% { opacity: 1; transform: scale(1); } }

        /* ========================================================
           MODO TV ESTRICTO: 4 Columnas, 2 Filas, 100% Pantalla
           ======================================================== */
        body.tv-mode {
            height: 100vh;
            overflow: hidden;
            padding: 1.5vh 1.5vw;
        }
        body.tv-mode .grid-container {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 1fr 1fr;
            height: 100%;
        }

        /* AJUSTES MÓVILES */
        @media (max-width: 768px) {
            body { padding: 15px; height: auto; overflow-y: visible;}
            
            /* En móvil la cabecera vuelve a apilarse para que no se vea apretada */
            .top-header { flex-direction: column; gap: 15px; text-align: center; }
            .header-left, .header-center, .header-right { justify-content: center; align-items: center; width: 100%; }
            .header-right { gap: 10px; }
            
            .grid-container { grid-template-columns: 1fr; height: auto; }
            .m-title { font-size: 20px; }
            .data-row { font-size: 13px; }
            .data-label { width: 50px; }
            .detenida-alert { animation: none; background-color: #ffc107; color: #000; border-color: #e0a800; box-shadow: none;} 
        }
    </style>
</head>
<body>

<div id="mainBody">
    <!-- Cabecera Horizontal -->
    <div class="top-header">
        <div class="header-left">
            <img src="libus_positivo_CMYK.jpg" alt="Libus" class="logo" onerror="this.src='https://latam.libus.com/imagenes/logo_libus.png'">
        </div>
        <div class="header-center">
            <h1 class="dashboard-title" id="mainTitle">Cargando...</h1>
            <div class="footer-update" id="lastUpdate">Actualizando datos...</div>
        </div>
        <div class="header-right">
            <div class="info-note">🟢 <strong>NIVEL 1:</strong> En producción actual.</div>
        </div>
    </div>

    <div id="loadingMsg">Consultando carga actual... ⏳</div>
    <div id="errorMsg"></div>

    <div class="grid-container" id="contentArea"></div>
</div>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkc0ZKvbaPhpI8alcHcGQvZEeQB5MmeBMzsx9NXU1t_X-QJi16x7DPiWmymR9FD2ApGw/exec'; 
    const urlParams = new URLSearchParams(window.location.search);
    const targetMachine = urlParams.get('m') || '1'; 
    const isDashboard = targetMachine.toUpperCase() === 'ALL';
    
    // Detecta si queremos "Modo TV"
    const isTVMode = isDashboard || urlParams.get('tv') === '1';
    
    const cacheKey = `libus_maquina_data_${targetMachine}`;

    if (isDashboard) {
        document.getElementById('mainTitle').innerText = "TABLERO GENERAL DE PRODUCCIÓN";
    } else {
        document.getElementById('mainTitle').innerText = targetMachine.toUpperCase() === 'E' ? `PLANILLA ENSAMBLE` : `PLANILLA MÁQUINA ${targetMachine}`;
        document.body.classList.add('single-mode'); 
    }

    // Si es Yodeck (TV) o modo ALL, bloqueamos la pantalla
    if (isTVMode) {
        document.body.classList.add('tv-mode');
    }

    function renderizarDatos(filasArray, isCached = false) {
        try {
            if (!filasArray || filasArray.length < 5) throw new Error("La planilla no tiene el formato esperado.");

            let fechaActualizacion = "Reciente";
            for (let cell of filasArray[0]) {
                if (cell && String(cell).includes(":")) {
                    fechaActualizacion = cell; break;
                }
            }
            const syncStatus = isCached ? '<span class="sync-indicator" title="Actualizando en segundo plano..."></span>' : '';
            document.getElementById('lastUpdate').innerHTML = `Última sincronización Excel: ${fechaActualizacion} ${syncStatus}`;

            const encabezados = filasArray[1];
            let maquinasARenderizar = [];

            for(let i = 2; i < encabezados.length; i++) {
                let colName = String(encabezados[i]).trim().toUpperCase();
                if (colName) {
                    if (isDashboard || colName === targetMachine.toUpperCase()) {
                        maquinasARenderizar.push({ name: colName, index: i });
                    }
                }
            }

            if(maquinasARenderizar.length === 0) throw new Error("No se encontraron datos para la máquina seleccionada.");

            let htmlFinal = "";

            maquinasARenderizar.forEach(maq => {
                let colIdx = maq.index;
                let tituloMaquina = maq.name === 'E' ? 'ENSAMBLE' : `MQ ${maq.name}`; 
                
                let primeraCeldaData = String(filasArray[3][colIdx]).trim().toUpperCase();
                
                htmlFinal += `
                <div class="machine-wrapper">
                    <div class="machine-header">
                        <h2 class="m-title">${tituloMaquina}</h2>
                    </div>`;

                if(primeraCeldaData.includes("DETENIDA")) {
                    htmlFinal += `
                    <div class="center-content">
                        <div class="detenida-alert">⚠️ MÁQUINA DETENIDA</div>
                    </div>`;
                } else {
                    let nivelesEncontrados = 0;
                    htmlFinal += `<div style="flex-grow: 1;">`; 
                    for(let r = 3; r < filasArray.length; r += 5) {
                        let cod = filasArray[r] ? String(filasArray[r][colIdx]).trim() : "";
                        if(cod === "") continue; 
                        
                        let numNivel = Math.floor((r - 3) / 5) + 1;
                        
                        // REGLA ESTRICTA: Mostrar como máximo Nivel 1 y Nivel 2
                        if (numNivel > 2) {
                            break; 
                        }

                        let ref = filasArray[r+1] ? String(filasArray[r+1][colIdx]).trim() : "-";
                        let op = filasArray[r+2] ? String(filasArray[r+2][colIdx]).trim() : "-";
                        let ctd = filasArray[r+3] ? String(filasArray[r+3][colIdx]).trim() : "-";

                        nivelesEncontrados++;

                        if (numNivel === 1) {
                            htmlFinal += `
                            <div class="nivel-card active">
                                <div class="nivel-header">
                                    <h3 class="nivel-title">NIVEL ${numNivel}</h3>
                                    <div class="badge-produccion">PROD.</div>
                                </div>
                                <div class="nivel-body">
                                    <div class="data-row"><div class="data-label">Cód:</div><div class="data-value">${cod}</div></div>
                                    <div class="data-row"><div class="data-label">Ref:</div><div class="data-value ref" title="${ref}">${ref}</div></div>
                                    <div class="data-row"><div class="data-label">OP:</div><div class="data-value">${op}</div></div>
                                    <div class="data-row"><div class="data-label">Cant:</div><div class="data-value">${ctd}</div></div>
                                </div>
                            </div>`;
                        } else {
                            htmlFinal += `
                            <div class="nivel-card normal">
                                <h3 class="nivel-title">NIVEL ${numNivel}</h3>
                                <div class="data-row"><div class="data-label">Cód:</div><div class="data-value">${cod}</div></div>
                                <div class="data-row"><div class="data-label">Ref:</div><div class="data-value ref" title="${ref}">${ref}</div></div>
                                <div class="data-row"><div class="data-label">OP:</div><div class="data-value">${op}</div></div>
                                <div class="data-row"><div class="data-label">Cant:</div><div class="data-value">${ctd}</div></div>
                            </div>`;
                        }
                    }
                    htmlFinal += `</div>`; 
                    
                    if(nivelesEncontrados === 2) {
                        htmlFinal += `<div class="empty-state" style="padding:0; margin-top: 5px;">+ Más en cola...</div>`;
                    }
                    if(nivelesEncontrados === 0) {
                        htmlFinal += `<div class="empty-state">No hay carga asignada.</div>`;
                    }
                }
                htmlFinal += `</div>`; 
            });

            document.getElementById('contentArea').innerHTML = htmlFinal;
            document.getElementById('loadingMsg').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';

        } catch (error) {
            console.error(error);
            if(!isCached) {
                document.getElementById('loadingMsg').style.display = 'none';
                let errDiv = document.getElementById("errorMsg");
                errDiv.innerText = "❌ " + error.message;
                errDiv.style.display = "block";
            }
        }
    }

    function descargarDatosJSONP() {
        const callbackName = 'jsonpCallback_' + Math.round(100000 * Math.random());
        
        window[callbackName] = function(filasArray) {
            localStorage.setItem(cacheKey, JSON.stringify(filasArray));
            renderizarDatos(filasArray, false);
            
            delete window[callbackName];
            const scriptEl = document.getElementById(callbackName);
            if(scriptEl) scriptEl.remove();
        };

        const script = document.createElement('script');
        script.id = callbackName;
        script.src = `${APPS_SCRIPT_URL}?callback=${callbackName}&m=${targetMachine}&_t=${Date.now()}`;
        
        script.onerror = function() {
            if (!localStorage.getItem(cacheKey)) {
                document.getElementById('loadingMsg').style.display = 'none';
                let errDiv = document.getElementById("errorMsg");
                errDiv.innerText = "❌ Error conectando con la base de datos.";
                errDiv.style.display = "block";
            }
        };

        document.body.appendChild(script);
    }

    function init() {
        const cachedData = localStorage.getItem(cacheKey);
        if (cachedData) {
            renderizarDatos(JSON.parse(cachedData), true);
        }
        descargarDatosJSONP();

        setInterval(descargarDatosJSONP, 300000);
    }

    window.onload = init;
</script>

</body>
</html>
