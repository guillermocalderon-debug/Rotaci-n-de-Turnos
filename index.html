<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Turnos</title>
    <style>
        :root {
            --primary: #0056b3;
            --bg: #f4f7f6;
            --text: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: var(--primary); margin-bottom: 5px; }
        p.subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-weight: bold; font-size: 0.9rem; color: #555; display: block; margin-bottom: 5px; }
        select, button { width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover:not(:disabled) { background-color: #004494; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        #loadingMsg { color: #d9534f; font-weight: bold; margin-bottom: 15px; }
        
        .result-card { display: none; margin-top: 25px; padding: 20px; border-radius: 8px; background-color: #e9ecef; text-align: left; animation: fadeIn 0.4s ease-in-out; }
        .result-card p { margin: 10px 0; font-size: 1.1rem; }
        .badge { display: inline-block; padding: 5px 10px; border-radius: 4px; color: white; font-weight: bold; font-size: 0.9rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Consulta de Turnos</h2>
    <p class="subtitle">Verifica tu máquina y horario asignado.</p>
    
    <div id="loadingMsg">Cargando base de datos... ⏳</div>

    <div class="form-group">
        <label for="workerSelect">Operario:</label>
        <select id="workerSelect" disabled>
            <option value="">-- Selecciona tu nombre --</option>
        </select>
    </div>

    <div class="form-group">
        <label for="dateSelect">Fecha:</label>
        <select id="dateSelect" disabled>
            <option value="">-- Selecciona la fecha --</option>
        </select>
    </div>
    
    <button id="btnConsultar" onclick="consultarAsignacion()" disabled>Consultar</button>

    <div id="result" class="result-card">
        <p><strong>Fecha:</strong> <span id="resFecha"></span></p>
        <p><strong>Turno:</strong> <span id="resTurno" class="badge"></span></p>
        <p><strong>Máquina(s):</strong> <span id="resMaquinas"></span></p>
    </div>
</div>

<script>
    // URL DE TU APPS SCRIPT YA CONFIGURADA
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx4a5m2v4JBikC6qDX-3ec0TGTjNvu0Aar43Zr--bdRWblEXqd9cY6ouTGQ7Y0UBfH1Tg/exec'; 

    let datosPlanilla = {
        fechas: [],
        operarios: {}
    };

    function descargarDatosJSONP() {
        const callbackName = 'jsonpCallback_' + Math.round(100000 * Math.random());
        
        window[callbackName] = function(filasArray) {
            try {
                if (!filasArray || filasArray.length === 0) throw new Error("Planilla vacía");

                // Fila 0: Encabezados -> [Turno, Operario, 01/09/2026...]
                datosPlanilla.fechas = filasArray[0].slice(2).filter(f => f !== ""); 
                
                // Formatear fechas
                datosPlanilla.fechas = datosPlanilla.fechas.map(f => {
                    if (f instanceof Date) {
                       let d = String(f.getDate()).padStart(2, '0');
                       let m = String(f.getMonth() + 1).padStart(2, '0');
                       let y = f.getFullYear();
                       return `${d}/${m}/${y}`;
                    }
                    if (typeof f === 'string' && f.includes('T')) {
                        let partes = f.split('T')[0].split('-'); 
                        if(partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
                    }
                    return String(f);
                });

                // Filas 1+: Datos de operarios
                for (let i = 1; i < filasArray.length; i++) {
                    let filaActual = filasArray[i];
                    if (filaActual.length < 2) continue;
                    
                    let nombreOperario = String(filaActual[1]).trim();
                    if (nombreOperario === "") continue;

                    datosPlanilla.operarios[nombreOperario] = {};
                    
                    for (let j = 0; j < datosPlanilla.fechas.length; j++) {
                        let valorCelda = filaActual[j + 2] !== undefined ? String(filaActual[j + 2]).trim() : "";
                        datosPlanilla.operarios[nombreOperario][datosPlanilla.fechas[j]] = valorCelda;
                    }
                }
                
                poblarSelectores();
                
            } catch (error) {
                console.error(error);
                document.getElementById("loadingMsg").innerText = "❌ Error procesando los datos de la planilla.";
            } finally {
                delete window[callbackName];
                const scriptEl = document.getElementById(callbackName);
                if(scriptEl) scriptEl.remove();
            }
        };

        const script = document.createElement('script');
        script.id = callbackName;
        script.src = APPS_SCRIPT_URL + "?callback=" + callbackName;
        
        script.onerror = function() {
            document.getElementById("loadingMsg").innerText = "❌ Error de red conectando con Apps Script.";
        };

        document.body.appendChild(script);
    }

    function poblarSelectores() {
        const selectTrabajador = document.getElementById("workerSelect");
        const selectFecha = document.getElementById("dateSelect");
        
        // Poblar Operarios
        const nombres = Object.keys(datosPlanilla.operarios).sort();
        nombres.forEach(nombre => {
            let option = document.createElement("option");
            option.value = nombre;
            option.text = nombre;
            selectTrabajador.appendChild(option);
        });

        // Poblar Fechas
        datosPlanilla.fechas.forEach(fecha => {
            let option = document.createElement("option");
            option.value = fecha;
            option.text = fecha;
            selectFecha.appendChild(option);
        });

        // Intentar seleccionar la fecha de hoy automáticamente
        const hoy = new Date();
        const dia = String(hoy.getDate()).padStart(2, '0');
        const mes = String(hoy.getMonth() + 1).padStart(2, '0');
        const anio = hoy.getFullYear();
        const fechaHoy = `${dia}/${mes}/${anio}`;
        
        if (datosPlanilla.fechas.includes(fechaHoy)) {
            selectFecha.value = fechaHoy;
        } else if (datosPlanilla.fechas.length > 0) {
            selectFecha.value = datosPlanilla.fechas[0];
        }

        // Habilitar controles
        document.getElementById("loadingMsg").style.display = "none";
        selectTrabajador.disabled = false;
        selectFecha.disabled = false;
        document.getElementById("btnConsultar").disabled = false;
    }

    function analizarCelda(valor) {
        if (!valor || valor === "") return { turno: "No asignado", maquina: "Ninguna", color: "#6c757d" };
        
        const v = valor.toUpperCase();
        if (v.includes("LIBRE")) return { turno: "Día Libre", maquina: "Descanso", color: "#28a745" };

        let turnoStr = "Desconocido";
        let colorBadge = "#6c757d";

        if (v.includes("(M)")) { turnoStr = "Mañana"; colorBadge = "#ffc107"; } 
        else if (v.includes("(T)")) { turnoStr = "Tarde"; colorBadge = "#17a2b8"; } 
        else if (v.includes("(N)")) { turnoStr = "Noche"; colorBadge = "#343a40"; }

        let maquinaStr = valor.replace(/\s*\([MTNmtn]\)\s*/g, '').trim();
        if (maquinaStr === "") maquinaStr = "Mantenimiento / Sin máquina";

        return { turno: turnoStr, maquina: maquinaStr, color: colorBadge };
    }

    function consultarAsignacion() {
        const operario = document.getElementById("workerSelect").value;
        const fecha = document.getElementById("dateSelect").value;
        const resultDiv = document.getElementById("result");

        if (operario === "" || fecha === "") {
            alert("Por favor selecciona un operario y una fecha.");
            resultDiv.style.display = "none";
            return;
        }

        const valorAsignado = datosPlanilla.operarios[operario][fecha];
        const datosProcesados = analizarCelda(valorAsignado);

        document.getElementById("resFecha").innerText = fecha;
        document.getElementById("resMaquinas").innerText = datosProcesados.maquina;
        
        const badgeTurno = document.getElementById("resTurno");
        badgeTurno.innerText = datosProcesados.turno;
        badgeTurno.style.backgroundColor = datosProcesados.color;
        badgeTurno.style.color = datosProcesados.turno === "Mañana" ? "#000" : "#fff";

        resultDiv.style.display = "block";
    }

    window.onload = descargarDatosJSONP;
</script>

</body>
</html>
