<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Turnos - Libus</title>
    <style>
        :root {
            /* Colores oficiales de la marca Libus */
            --primary: #e6005a; 
            --bg: #f4f7f6;
            --text: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; box-sizing: border-box; }
        
        /* Estilos del Logo */
        .logo { max-width: 160px; margin-bottom: 10px; }
        
        h2 { color: #333; margin-bottom: 5px; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        
        .form-group { text-align: left; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 0.9rem; color: #555; display: block; margin-bottom: 8px; text-transform: uppercase; }
        select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; background-color: #fdfdfd; transition: 0.3s; }
        select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 5px rgba(230, 0, 90, 0.2); }
        
        #loadingMsg { color: #d9534f; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
        
        .tabs { display: none; gap: 8px; margin-bottom: 20px; margin-top: 10px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.3s; background-color: #e2e8f0; color: #64748b; }
        .tab-btn.active { background-color: var(--primary); color: white; box-shadow: 0 4px 10px rgba(230, 0, 90, 0.3); }
        
        .result-container { display: none; animation: fadeIn 0.4s ease-in-out; text-align: left; }
        
        .card-hoy { background-color: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 10px; border-top: 4px solid var(--primary); }
        .card-hoy h3 { margin: 0 0 15px 0; color: #333; font-size: 18px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .card-hoy p { margin: 10px 0; font-size: 16px; color: #555; }
        .card-hoy .maquina-text { font-size: 18px; font-weight: bold; color: #222; }

        .tabla-turnos { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .tabla-turnos th, .tabla-turnos td { padding: 10px; border-bottom: 1px solid #ddd; text-align: center; }
        .tabla-turnos th { background-color: #f1f5f9; color: #333; font-weight: bold; text-transform: uppercase; font-size: 12px; }
        .tabla-turnos tr:hover { background-color: #f8f9fa; }
        
        .badge { display: inline-block; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        
        /* Estilo para la nota informativa */
        .info-note {
            display: none; /* Se oculta por defecto, se muestra junto con los resultados */
            margin-top: 20px;
            background-color: #ffe5ed;
            color: #b30046;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 6px;
            font-size: 14px;
            text-align: left;
            line-height: 1.4;
            animation: fadeIn 0.6s ease-in-out;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGO DE LIBUS -->
    <img src="libus_positivo_CMYK.jpg" alt="Logo Libus" class="logo" onerror="this.src='https://latam.libus.com/imagenes/logo_libus.png'">
    
    <h2>Consulta de Turnos</h2>
    <p class="subtitle">Verifica tu máquina y horario asignado.</p>
    
    <div id="loadingMsg">Conectando con la base de datos... ⏳</div>

    <div class="form-group">
        <label for="workerSelect">Operario:</label>
        <select id="workerSelect" disabled onchange="iniciarVista()">
            <option value="">-- Selecciona tu nombre --</option>
        </select>
    </div>

    <div class="tabs" id="tabsContainer">
        <button class="tab-btn active" onclick="setVista('HOY')" id="btnHoy">Día Actual</button>
        <button class="tab-btn" onclick="setVista('SEMANA')" id="btnSemana">Próx. 7 Días</button>
        <button class="tab-btn" onclick="setVista('MES')" id="btnMes">Mes Completo</button>
    </div>

    <div id="resultArea" class="result-container"></div>
    
    <!-- Nota Informativa -->
    <div id="infoNote" class="info-note">
        <strong>⚠️ Importante:</strong> Si alguna máquina se encuentra detenida, se deberá realizar ensambles o cualquier otra actividad que el líder de equipo les asigne.
    </div>
</div>

<script>
    // Enlace de Apps Script 
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzxBhGp2oElpCW6YzacSbDhqGvbih0X0dBZmnipIkscPp2uJx2CqRQstESXu7M0iZ1gLA/exec'; 

    let datosPlanilla = {
        fechas: [],
        operarios: {}
    };
    
    let vistaActual = 'HOY';

    function normalizarFecha(str) {
        if (!str) return "";
        let s = String(str).trim();
        if (s.includes("/")) {
            let partes = s.split("/");
            if(partes.length === 3) {
                let d = String(partes[0]).padStart(2, '0');
                let m = String(partes[1]).padStart(2, '0');
                return `${d}/${m}/${partes[2]}`;
            }
        }
        return s;
    }

    function descargarDatosJSONP() {
        const callbackName = 'jsonpCallback_' + Math.round(100000 * Math.random());
        
        window[callbackName] = function(filasArray) {
            try {
                if (!filasArray || filasArray.length === 0) throw new Error("Planilla vacía");

                let headerIndex = 0;
                for (let i = 0; i < Math.min(5, filasArray.length); i++) {
                    if (filasArray[i] && String(filasArray[i][1]).trim().toLowerCase() === "operario") {
                        headerIndex = i;
                        break;
                    }
                }

                let rawFechas = filasArray[headerIndex].slice(2).filter(f => f && String(f).trim() !== ""); 
                datosPlanilla.fechas = rawFechas.map(normalizarFecha);

                if(datosPlanilla.fechas.length === 0) {
                    throw new Error("No se detectaron fechas válidas en la planilla");
                }

                for (let i = headerIndex + 1; i < filasArray.length; i++) {
                    let filaActual = filasArray[i];
                    if (filaActual.length < 2) continue;
                    
                    let nombreOperario = String(filaActual[1]).trim();
                    if (nombreOperario === "") continue;

                    datosPlanilla.operarios[nombreOperario] = {};
                    
                    for (let j = 0; j < datosPlanilla.fechas.length; j++) {
                        let valorCelda = filaActual[j + 2] !== undefined ? String(filaActual[j + 2]).trim() : "";
                        datosPlanilla.operarios[nombreOperario][datosPlanilla.fechas[j]] = valorCelda;
                    }
                }
                
                poblarSelectores();
                
            } catch (error) {
                console.error(error);
                document.getElementById("loadingMsg").innerText = "❌ Error: " + error.message;
            } finally {
                delete window[callbackName];
                const scriptEl = document.getElementById(callbackName);
                if(scriptEl) scriptEl.remove();
            }
        };

        const script = document.createElement('script');
        script.id = callbackName;
        script.src = APPS_SCRIPT_URL + "?callback=" + callbackName;
        
        script.onerror = function() {
            document.getElementById("loadingMsg").innerText = "❌ Error de red conectando con Apps Script.";
        };

        document.body.appendChild(script);
    }

    function poblarSelectores() {
        const selectTrabajador = document.getElementById("workerSelect");
        const nombres = Object.keys(datosPlanilla.operarios).sort();
        
        nombres.forEach(nombre => {
            let option = document.createElement("option");
            option.value = nombre;
            option.text = nombre;
            selectTrabajador.appendChild(option);
        });

        document.getElementById("loadingMsg").style.display = "none";
        selectTrabajador.disabled = false;
    }

    function analizarCelda(valor) {
        if (!valor || valor === "") return { turno: "-", maquina: "-", bg: "#e2e8f0", text: "#64748b" };
        
        const v = valor.toUpperCase();
        if (v.includes("LIBRE")) return { turno: "Día Libre", maquina: "Descanso", bg: "#28a745", text: "#fff" };

        let turnoStr = "Desconocido";
        let bgBadge = "#6c757d";
        let textBadge = "#fff";

        if (v.includes("(M)")) { turnoStr = "Mañana"; bgBadge = "#ffc107"; textBadge = "#000"; } 
        else if (v.includes("(T)")) { turnoStr = "Tarde"; bgBadge = "#17a2b8"; textBadge = "#fff"; } 
        else if (v.includes("(N)")) { turnoStr = "Noche"; bgBadge = "#343a40"; textBadge = "#fff"; } 

        let maquinaStr = valor.replace(/\s*\([MTNmtn]\)\s*/g, '').trim();
        if (maquinaStr === "") maquinaStr = "Mantenimiento / Sin máquina";

        return { turno: turnoStr, maquina: maquinaStr, bg: bgBadge, text: textBadge };
    }

    function getHoyStr() {
        const hoy = new Date();
        const d = String(hoy.getDate()).padStart(2, '0');
        const m = String(hoy.getMonth() + 1).padStart(2, '0');
        return `${d}/${m}/${hoy.getFullYear()}`;
    }

    function iniciarVista() {
        const operario = document.getElementById("workerSelect").value;
        if(operario === "") {
            document.getElementById("tabsContainer").style.display = "none";
            document.getElementById("resultArea").style.display = "none";
            document.getElementById("infoNote").style.display = "none";
            return;
        }
        document.getElementById("tabsContainer").style.display = "flex";
        setVista('HOY'); 
        
        // Muestra la nota informativa una vez que el operario se ha seleccionado
        document.getElementById("infoNote").style.display = "block";
    }

    function setVista(vista) {
        vistaActual = vista;
        document.getElementById("btnHoy").className = "tab-btn" + (vista === 'HOY' ? " active" : "");
        document.getElementById("btnSemana").className = "tab-btn" + (vista === 'SEMANA' ? " active" : "");
        document.getElementById("btnMes").className = "tab-btn" + (vista === 'MES' ? " active" : "");
        renderizarDatos();
    }

    function renderizarDatos() {
        const operario = document.getElementById("workerSelect").value;
        const resultArea = document.getElementById("resultArea");
        
        let hoyStr = getHoyStr();
        let indexHoy = datosPlanilla.fechas.indexOf(hoyStr);
        if(indexHoy === -1) indexHoy = 0; 

        let html = '';

        if (vistaActual === 'HOY') {
            let fechaMostrar = datosPlanilla.fechas.includes(hoyStr) ? hoyStr : datosPlanilla.fechas[0];
            let valorAsignado = datosPlanilla.operarios[operario][fechaMostrar];
            let datos = analizarCelda(valorAsignado);
            let titulo = fechaMostrar === hoyStr ? "Turno de Hoy" : `Turno del ${fechaMostrar}`;

            html = `
            <div class="card-hoy">
                <h3>📅 ${titulo}</h3>
                <p><strong>Turno:</strong> <span class="badge" style="background:${datos.bg}; color:${datos.text}">${datos.turno}</span></p>
                <p><strong>Máquina(s):</strong></p>
                <p class="maquina-text">${datos.maquina}</p>
            </div>
            `;
        } 
        else {
            let diasAMostrar = (vistaActual === 'SEMANA') ? 7 : 30;
            let fechasRecorte = datosPlanilla.fechas.slice(indexHoy, indexHoy + diasAMostrar);

            html = `
            <table class="tabla-turnos">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Turno</th>
                        <th>Máquina</th>
                    </tr>
                </thead>
                <tbody>
            `;

            fechasRecorte.forEach(fecha => {
                let valor = datosPlanilla.operarios[operario][fecha];
                let datos = analizarCelda(valor);
                let fechaCorta = fecha.substring(0, 5); 

                html += `
                <tr>
                    <td><strong>${fechaCorta}</strong></td>
                    <td><span class="badge" style="background:${datos.bg}; color:${datos.text}">${datos.turno}</span></td>
                    <td>${datos.maquina}</td>
                </tr>
                `;
            });

            html += `</tbody></table>`;
        }

        resultArea.innerHTML = html;
        resultArea.style.display = "block";
    }

    window.onload = descargarDatosJSONP;
</script>

</body>
</html>
